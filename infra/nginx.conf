# Production single-origin reverse proxy (NFR-02, design.md §1).
#
# One public hostname fronts both deployables so the Django session cookie
# stays first-party — no CORS, no SameSite=None. Django (gunicorn) owns
# /api/, /admin/, and /django-static/; everything else goes to the Next.js
# Node server.

upstream django_backend {
    server 127.0.0.1:8000;
}

upstream next_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 443 ssl;
    server_name notes-app.example.com;

    # ssl_certificate     /etc/ssl/notes-app/fullchain.pem;
    # ssl_certificate_key /etc/ssl/notes-app/privkey.pem;

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-static/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://next_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name notes-app.example.com;
    return 301 https://$host$request_uri;
}
